owner: nathanmillar16
repo: status
user-agent: nathanmillar16

# Only the scoped Vercel bypass and Home Assistant notification values needed
# by the monitor are exposed to the generated workflows.
secrets:
  - LITTLE_ROSE_VERCEL_BYPASS
  - NOTIFICATION_CUSTOM_WEBHOOK
  - NOTIFICATION_CUSTOM_WEBHOOK_URL
  - NOTIFICATIONS_DOWN_MESSAGE
  - NOTIFICATIONS_UP_MESSAGE

# Add future customer-facing applications here to keep one shared status page.
sites:
  - name: Portfolio website
    slug: portfolio
    url: https://www.nathanmillar.co.uk/
    icon: https://status.nathanmillar.co.uk/nm-favicon.svg
    expectedStatusCodes:
      - 200

  - name: Client portal
    slug: client-portal
    url: https://portal.nathanmillar.co.uk/api/health
    icon: https://status.nathanmillar.co.uk/nm-favicon.svg
    expectedStatusCodes:
      - 200

  - name: Meet The Millars
    slug: meet-the-millars
    url: https://www.meetthemillars.com/
    expectedStatusCodes:
      - 200

  - name: WedChapter
    slug: wedchapter
    url: https://www.wedchapter.com/
    expectedStatusCodes:
      - 200

  - name: Leedon
    slug: leedon
    url: https://www.leedon.co.uk/
    expectedStatusCodes:
      - 200

  - name: Little Rose
    slug: little-rose
    url: https://www.littlerose.shop/
    headers:
      - "x-vercel-protection-bypass: $LITTLE_ROSE_VERCEL_BYPASS"
    expectedStatusCodes:
      - 200

# The full check includes Neon and all customer-facing applications, so run it
# every 30 minutes to keep traffic modest and leave room for the database to
# scale to zero. A separate workflow checks the portfolio website every
# 5 minutes.
workflowSchedule:
  uptime: "2,32 * * * *"

assignees:
  - nathanmillar16

status-website:
  cname: status.nathanmillar.co.uk
  themeUrl: https://status.nathanmillar.co.uk/nathan-millar-theme.css
  logoUrl: https://status.nathanmillar.co.uk/nm-logo.svg
  faviconSvg: https://status.nathanmillar.co.uk/nm-favicon.svg
  name: Nathan Millar Status
  introTitle: "**All Nathan Millar systems, at a glance.**"
  introMessage: Live availability and response-time history for Nathan Millar websites and applications. If we detect an interruption, updates will be posted here.
  navbar:
    - title: Status
      href: /
    - title: Nathan Millar
      href: https://www.nathanmillar.co.uk/
    - title: Client portal
      href: https://portal.nathanmillar.co.uk/

i18n:
  footer: "Nathan Millar service monitoring · Powered by [Upptime](https://upptime.js.org) · [View source]($REPO)"
