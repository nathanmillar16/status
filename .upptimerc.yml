owner: nathanmillar16
repo: status
user-agent: nathanmillar16

# No private application credentials are passed to monitoring workflows.
secrets: []

# Add future customer-facing applications here to keep one shared status page.
sites:
  - name: Portfolio website
    slug: portfolio
    url: https://www.nathanmillar.co.uk/
    expectedStatusCodes:
      - 200

  - name: Client portal
    slug: client-portal
    url: https://portal.nathanmillar.co.uk/api/health
    expectedStatusCodes:
      - 200

# The full check includes Neon, so run it every 30 minutes to leave room for
# the database to scale to zero. A separate workflow checks the portfolio
# website every 5 minutes.
workflowSchedule:
  uptime: "2,32 * * * *"

assignees:
  - nathanmillar16

status-website:
  cname: status.nathanmillar.co.uk
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Nathan Millar Service Status
  introTitle: "**Service availability for Nathan Millar applications.**"
  introMessage: Current availability, response-time history, and incident updates for customer-facing applications.
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://www.nathanmillar.co.uk/
    - title: Client portal
      href: https://portal.nathanmillar.co.uk/
