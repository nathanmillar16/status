owner: nathanmillar16
repo: status
user-agent: nathanmillar16

# The portfolio has a separate five-minute checker, so it needs the same
# notification values as the full monitor to send incidents and recoveries.
secrets:
  - NOTIFICATION_CUSTOM_WEBHOOK
  - NOTIFICATION_CUSTOM_WEBHOOK_URL
  - NOTIFICATIONS_DOWN_MESSAGE
  - NOTIFICATIONS_UP_MESSAGE

# Used by the portfolio-only workflow so this static endpoint can be checked
# frequently without also waking the client portal database.
sites:
  - name: Portfolio website
    slug: portfolio
    url: https://www.nathanmillar.co.uk/
    expectedStatusCodes:
      - 200

assignees:
  - nathanmillar16
