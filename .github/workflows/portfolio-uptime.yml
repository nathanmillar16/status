name: Portfolio Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [portfolio_uptime]
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false

jobs:
  release:
    name: Check portfolio status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Select portfolio-only monitoring configuration
        run: |
          git update-index --skip-worktree .upptimerc.yml
          cp .upptimerc-portfolio.yml .upptimerc.yml

      - name: Check portfolio status
        uses: upptime/uptime-monitor@v1.43.15
        with:
          command: "update"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
          SECRETS_CONTEXT: '{}'
